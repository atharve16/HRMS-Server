server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: hrms-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      database: ${MONGODB_DATABASE:hrms}
      auto-index-creation: true
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

brevo:
  api:
    url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
    key: ${BREVO_API_KEY:}
    connect-timeout: ${BREVO_CONNECT_TIMEOUT:5s}
    response-timeout: ${BREVO_RESPONSE_TIMEOUT:10s}

app:
  company:
    time-zone: ${COMPANY_TIMEZONE:Asia/Kolkata}
  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:3000}
  geofence:
    default-radius-meters: ${DEFAULT_GEOFENCE_RADIUS:100}
    max-gps-accuracy-meters: ${MAX_GPS_ACCURACY:50}
  employee:
    code-prefix: ${EMPLOYEE_CODE_PREFIX:EMP}
  attendance:
    early-check-in-minutes: ${ATTENDANCE_EARLY_CHECKIN_MINUTES:120}
    late-check-in-window-minutes: ${ATTENDANCE_LATE_CHECKIN_WINDOW_MINUTES:240}
    overnight-checkout-grace-minutes: ${ATTENDANCE_OVERNIGHT_CHECKOUT_GRACE_MINUTES:240}
    max-session-duration-hours: ${ATTENDANCE_MAX_SESSION_DURATION_HOURS:24}
  auth:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:hrms-backend}
      access-expiry: ${JWT_ACCESS_EXPIRY:900000}ms
      refresh-expiry: ${JWT_REFRESH_EXPIRY:2592000000}ms
    otp:
      hash-secret: ${OTP_HASH_SECRET:}
      expiry: ${OTP_EXPIRY:300000}ms
      resend-cooldown: ${OTP_RESEND_COOLDOWN:60000}ms
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
    cookie:
      refresh-token-name: ${REFRESH_COOKIE_NAME:hrms_refresh_token}
      path: /api/v1/auth
      secure: ${COOKIE_SECURE:false}
      same-site: ${COOKIE_SAME_SITE:Lax}
      domain: ${COOKIE_DOMAIN:}
    mail:
      from: ${MAIL_FROM:}
      from-name: ${MAIL_FROM_NAME:HRMS}
    rate-limit:
      max-requests-per-ip: ${OTP_RATE_LIMIT_MAX_REQUESTS:10}
      window: ${OTP_RATE_LIMIT_WINDOW:300000}ms
    bootstrap:
      initial-admin-email: ${INITIAL_ADMIN_EMAIL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
